# Deploy the password-gated online procurement app to Render.
# The secret is intentionally NOT committed to GitHub.
services:
  - type: web
    name: ai-snabzhenets-online
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run online_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SNAB_ACCESS_PASSWORD
        sync: false
