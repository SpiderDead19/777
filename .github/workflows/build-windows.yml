name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/ai-snabzhenets-3"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name "AI-Snabzhenets"
          --collect-all streamlit
          --collect-all pdfplumber
          --collect-all rapidfuzz
          --collect-all openpyxl
          --add-data "online_app.py;."
          --add-data "online_core.py;."
          --add-data "pdf_parser.py;."
          --add-data ".streamlit;.streamlit"
          launcher.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Snabzhenets-Windows
          path: dist/AI-Snabzhenets.exe
          if-no-files-found: error
          retention-days: 30
