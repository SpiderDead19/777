name: Online procurement checks

on:
  pull_request:
    paths:
      - "online_app.py"
      - "online_core.py"
      - "pdf_parser.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test-online.yml"
  push:
    branches:
      - "feature/online-ai-snabzhenets"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q online_core.py online_app.py pdf_parser.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
